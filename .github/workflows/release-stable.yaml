# FILE_NAME: release-stable.yaml
# DESCRIPTION: Stable release from release/X.Y.Z — tag, publish, merge main, bump develop
# VERSION: 1.0.0
# AUTHORS: ravichandrapatel

name: release-stable

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-stable-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-stable:
    # Skip bot commits that only bump docs after version set on the release branch
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Resolve stable version from branch name
        id: ver
        run: |
          set -euo pipefail
          CHART_FILE=charts/namespace-as-service/Chart.yaml
          CURRENT="$(awk '/^version:/ {print $2; exit}' "${CHART_FILE}")"
          STABLE="$(python3 .github/scripts/semver_bump.py stable-from-branch "${GITHUB_REF}" "${CURRENT}")"
          NEXT_DEV="$(python3 .github/scripts/semver_bump.py bump "${STABLE}" next-dev patch)"
          sed -i "s/^version: .*/version: ${STABLE}/" "${CHART_FILE}"
          sed -i "s/^appVersion: .*/appVersion: \"${STABLE}\"/" "${CHART_FILE}"
          echo "version=${STABLE}" >> "${GITHUB_OUTPUT}"
          echo "next_dev=${NEXT_DEV}" >> "${GITHUB_OUTPUT}"
          echo "Stable ${CURRENT} -> ${STABLE}; next develop cycle ${NEXT_DEV}"

      - name: Generate CHANGELOG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/generate_changelog.sh
          .github/scripts/generate_changelog.sh "${VERSION}"

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3

      - name: Dependency update
        run: |
          set -euo pipefail
          helm dependency update charts/namespace-as-service

      - name: Install helm-unittest
        run: |
          set -euo pipefail
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.8.0

      - name: Lint and unittest
        run: |
          set -euo pipefail
          helm lint charts/namespace-as-service --set tenant=test --set namespaces[0].name=test-dev \
            --set argocd.enabled=false --set tekton.enabled=false
          helm unittest charts/namespace-as-service --with-subchart=false

      - name: Regenerate helm-docs
        env:
          HELM_DOCS_VERSION: "1.14.2"
        run: |
          set -euo pipefail
          curl -sL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /tmp helm-docs
          sudo mv /tmp/helm-docs /usr/local/bin/helm-docs
          helm-docs -c charts/namespace-as-service -t charts/namespace-as-service/README.md.gotmpl

      - name: Commit stable version on release branch and tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "ravichandrapatel"
          git config user.email "cheetiravi@gmail.com"
          git add charts/namespace-as-service/Chart.yaml charts/namespace-as-service/README.md CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git tag -a "v${VERSION}" -m "namespace-as-service v${VERSION}"
          git push origin "HEAD:${BRANCH}"
          git push origin "v${VERSION}"

      - name: Package chart
        id: pkg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package charts/namespace-as-service -d dist
          echo "tgz=dist/namespace-as-service-${VERSION}.tgz" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI chart
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          helm push "dist/namespace-as-service-${VERSION}.tgz" "oci://ghcr.io/${OWNER_LC}/charts"

      - name: Create GitHub stable release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          # Match actions/setup-node style: title is the version only (e.g. v1.0.0)
          name: v${{ steps.ver.outputs.version }}
          prerelease: false
          make_latest: true
          files: ${{ steps.pkg.outputs.tgz }}
          generate_release_notes: true

      - name: Merge release into main
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main develop
          git checkout main
          git pull origin main
          git merge --ff-only "origin/${BRANCH}" || git merge --no-ff "origin/${BRANCH}" -m "chore(release): merge ${BRANCH} (v${VERSION}) into main"
          git push origin main

      - name: Merge release into develop and start next RC cycle
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.ver.outputs.version }}
          NEXT_DEV: ${{ steps.ver.outputs.next_dev }}
        run: |
          set -euo pipefail
          CHART_FILE=charts/namespace-as-service/Chart.yaml
          git checkout develop
          git pull origin develop
          git merge --ff-only "origin/${BRANCH}" || git merge --no-ff "origin/${BRANCH}" -m "chore(release): merge ${BRANCH} (v${VERSION}) into develop"
          sed -i "s/^version: .*/version: ${NEXT_DEV}/" "${CHART_FILE}"
          sed -i "s/^appVersion: .*/appVersion: \"${NEXT_DEV}\"/" "${CHART_FILE}"
          helm-docs -c charts/namespace-as-service -t charts/namespace-as-service/README.md.gotmpl
          git add charts/namespace-as-service/Chart.yaml charts/namespace-as-service/README.md
          git commit -m "chore(release): start next cycle ${NEXT_DEV}"
          git push origin develop
