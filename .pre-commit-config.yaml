# FILE_NAME: .pre-commit-config.yaml
# DESCRIPTION: helm-docs + helm unittest on commit
# VERSION: 1.1.0
# AUTHORS: ravichandrapatel

repos:
  - repo: https://github.com/norwoodj/helm-docs
    rev: v1.14.2
    hooks:
      - id: helm-docs
        args:
          - --chart-search-root=charts
          - --template-files=README.md.gotmpl

  - repo: local
    hooks:
      - id: helm-unittest
        name: helm-unittest
        language: system
        pass_filenames: false
        files: ^(charts/|\.pre-commit-config\.yaml$)
        entry: bash -c 'set -euo pipefail
          if ! command -v helm >/dev/null 2>&1; then
            echo "helm is required for the helm-unittest pre-commit hook" >&2
            exit 1
          fi
          if ! helm plugin list 2>/dev/null | grep -q "^unittest"; then
            helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.8.0
          fi
          helm dependency update charts/namespace-as-service >/dev/null
          helm lint charts/namespace-as-service --set tenant=test --set namespaces[0].name=test-dev \
            --set argocd.enabled=false --set tekton.enabled=false
          helm unittest charts/namespace-as-service --with-subchart=false
          '
