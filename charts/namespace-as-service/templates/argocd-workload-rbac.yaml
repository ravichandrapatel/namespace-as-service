{{- if .Values.argocd.enabled }}
{{- $devopsName := include "namespace-as-service.devopsNamespace" . }}
{{- /* Grant namespaced Argo CD controller SA deploy rights in each workload NS */}}
{{- range .Values.namespaces }}
{{- $cfg := . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-deploy
  namespace: {{ $cfg.name }}
  labels:
    {{- include "namespace-as-service.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-deploy
  namespace: {{ $cfg.name }}
  labels:
    {{- include "namespace-as-service.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-deploy
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: {{ $devopsName }}
  - kind: ServiceAccount
    name: argocd-server
    namespace: {{ $devopsName }}
  - kind: ServiceAccount
    name: argocd-applicationset-controller
    namespace: {{ $devopsName }}
{{- end }}
{{- end }}
