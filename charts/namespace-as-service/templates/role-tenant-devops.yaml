{{- if eq (include "namespace-as-service.devopsEnabled" .) "true" }}
{{- $devopsName := include "namespace-as-service.devopsNamespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-devops
  namespace: {{ $devopsName }}
  labels:
    {{- include "namespace-as-service.labels" . | nindent 4 }}
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines", "tasks", "pipelineruns", "taskruns", "customruns", "stepactions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets", "appprojects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- if eq (include "namespace-as-service.hasGroups" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-devops
  namespace: {{ $devopsName }}
  labels:
    {{- include "namespace-as-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-devops
subjects:
  {{- include "namespace-as-service.groupSubjects" . | nindent 2 }}
{{- end }}
{{- end }}
