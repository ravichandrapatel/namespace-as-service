apiVersion: v2
name: namespace-as-service
description: Multitenant Namespace-as-a-Service — workload namespaces, optional devops with namespaced Argo CD and Tekton RBAC, k* instance-size quotas.
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - namespace
  - multi-tenant
  - idp
  - naas
  - argocd
  - tekton
maintainers:
  - name: ravichandrapatel
dependencies:
  - name: argo-cd
    alias: argocd
    version: 10.2.1
    repository: https://argoproj.github.io/argo-helm
    condition: argocd.enabled
