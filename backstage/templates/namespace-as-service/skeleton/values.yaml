# FILE_NAME: values.yaml
# DESCRIPTION: Generated Helm values for Namespace-as-a-Service tenant
# VERSION: 1.0.0
# AUTHORS: ravichandrapatel
#
# Chart: oci://ghcr.io/ravichandrapatel/charts/namespace-as-service
# Version: ${{ values.chartVersion }}

tenant: ${{ values.tenant | dump }}

instanceSize: ${{ values.instanceSize | dump }}

namespaces:
{%- for env in values.environments %}
  - name: ${{ values.tenant }}-${{ env }}
{%- endfor %}

namespaceDefaults:
  labels:
    product: ${{ values.tenant | dump }}
    managed-by: backstage

groups:
{%- if values.groups and values.groups|length > 0 %}
{%- for group in values.groups %}
  - ${{ group | dump }}
{%- endfor %}
{%- else %}
  - ${{ values.tenant }}-admins
{%- endif %}

argocd:
  enabled: ${{ values.enableArgoCD }}

tekton:
  enabled: ${{ values.enableTekton }}

{%- if values.enableArgoCD or values.enableTekton %}
devops:
  instanceSize: ${{ values.devopsInstanceSize | dump }}
{%- endif %}
