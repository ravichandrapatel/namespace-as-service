# FILE_NAME: template.yaml
# DESCRIPTION: Backstage scaffolder template for Namespace-as-a-Service tenants
# VERSION: 1.0.0
# AUTHORS: ravichandrapatel

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: namespace-as-service
  title: Namespace as a Service
  description: >
    Provision a single-tenant Namespace-as-a-Service GitOps repo with Helm values
    for workload namespaces, optional devops (Argo CD / Tekton), quotas, and RBAC groups.
  tags:
    - kubernetes
    - helm
    - naas
    - multi-tenant
    - namespace
  annotations:
    backstage.io/source-template: namespace-as-service
spec:
  owner: group:default/platform
  type: resource

  parameters:
    - title: Tenant
      required:
        - tenant
        - environments
        - instanceSize
        - owner
      properties:
        tenant:
          title: Tenant / product id
          type: string
          description: >
            Short product id. Every namespace name must be prefixed with "{tenant}-"
            (e.g. tenant "payments" → payments-dev).
          pattern: '^[a-z][a-z0-9-]{1,30}$'
          ui:autofocus: true
          ui:help: Lowercase letters, digits, and hyphens only.
        environments:
          title: Environment suffixes
          type: array
          description: Suffixes appended as {tenant}-{suffix} workload namespaces.
          default:
            - dev
            - uat
          minItems: 1
          items:
            type: string
            pattern: '^[a-z][a-z0-9-]{0,20}$'
          uniqueItems: true
        instanceSize:
          title: Default instance size
          type: string
          description: T-shirt size applied to every workload namespace (presets in the chart).
          default: kgen.medium
          enum:
            - kgen.medium
            - kgen.large
            - kgen.xlarge
            - kgen.2xlarge
            - kgen.4xlarge
            - km.medium
            - km.large
            - km.xlarge
            - km.2xlarge
            - km.4xlarge
            - kc.medium
            - kc.large
            - kc.xlarge
            - kc.2xlarge
            - kc.4xlarge
            - kgpu.medium
            - kgpu.large
            - kgpu.xlarge
            - kgpu.2xlarge
            - kgpu.4xlarge
            - custom
        groups:
          title: RBAC groups
          type: array
          description: Entra / Okta / AD group names bound to hardcoded tenant Roles.
          default: []
          items:
            type: string
          ui:options:
            addable: true
            orderable: true
        owner:
          title: Owner
          type: string
          description: Backstage owner entity ref (user: or group:).
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User

    - title: Platform options
      properties:
        enableArgoCD:
          title: Enable namespaced Argo CD
          type: boolean
          default: true
          description: Creates {tenant}-devops and installs namespaced Argo CD there.
        enableTekton:
          title: Enable Tekton RBAC
          type: boolean
          default: true
          description: Pipeline ServiceAccount + deploy RoleBindings into workload namespaces.
        devopsInstanceSize:
          title: Devops namespace size
          type: string
          default: kgen.large
          description: Optional size for {tenant}-devops (used when Argo CD or Tekton is enabled).
          enum:
            - kgen.medium
            - kgen.large
            - kgen.xlarge
            - km.medium
            - km.large
            - kc.medium
            - kc.large
        chartVersion:
          title: Chart version
          type: string
          default: "1.0.0"
          description: OCI chart version from ghcr.io/ravichandrapatel/charts/namespace-as-service.
          pattern: '^\d+\.\d+\.\d+(-rc\.\d+)?$'
        system:
          title: System
          type: string
          description: Optional Backstage System entity name this tenant belongs to.
          default: namespace-platform

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository location
          type: string
          description: GitHub repo that will hold the generated GitOps values.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
        repoVisibility:
          title: Repository visibility
          type: string
          default: private
          enum:
            - private
            - public
            - internal

  steps:
    - id: fetch-base
      name: Generate tenant GitOps bundle
      action: fetch:template
      input:
        url: ./skeleton
        values:
          tenant: ${{ parameters.tenant }}
          environments: ${{ parameters.environments }}
          instanceSize: ${{ parameters.instanceSize }}
          groups: ${{ parameters.groups if parameters.groups else [] }}
          owner: ${{ parameters.owner }}
          enableArgoCD: ${{ parameters.enableArgoCD }}
          enableTekton: ${{ parameters.enableTekton }}
          devopsInstanceSize: ${{ parameters.devopsInstanceSize }}
          chartVersion: ${{ parameters.chartVersion }}
          system: ${{ parameters.system }}
          name: ${{ parameters.tenant }}-naas

    - id: publish
      name: Publish GitHub repository
      action: publish:github
      input:
        description: Namespace-as-a-Service GitOps values for tenant ${{ parameters.tenant }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: ${{ parameters.repoVisibility }}
        gitCommitMessage: "chore: scaffold namespace-as-service for ${{ parameters.tenant }}"
        gitAuthorName: ravichandrapatel
        gitAuthorEmail: cheetiravi@gmail.com

    - id: register
      name: Register in software catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: Chart docs
        url: https://github.com/ravichandrapatel/namespace-as-service
    text:
      - title: Install
        content: |
          ```bash
          helm install ${{ parameters.tenant }} oci://ghcr.io/ravichandrapatel/charts/namespace-as-service \
            --version ${{ parameters.chartVersion }} \
            -n ${{ parameters.tenant }}-devops --create-namespace \
            -f values.yaml
          ```
